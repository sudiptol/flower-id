<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Makes the page fit the phone's screen instead of a zoomed-out desktop view -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flower ID</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>Flower ID</h1>

    <!-- State A: Start -->
    <section id="start">
      <!-- capture="environment" asks the phone to open its back camera directly -->
      <input class="visually-hidden" id="camera-input" type="file" accept="image/*" capture="environment">
      <label class="button" for="camera-input">Take a photo</label>

      <input class="visually-hidden" id="library-input" type="file" accept="image/*">
      <label class="button" for="library-input">Choose a photo</label>
    </section>

    <!-- State B: Working. For now it only shows the photo; identifying comes in step 4. -->
    <section id="preview" hidden>
      <img id="preview-image" class="photo" alt="The photo you chose">
      <p class="note">Photo ready. Identifying it comes in a later step.</p>
      <button class="button" type="button" data-action="start-over">Start over</button>
    </section>

    <!-- State E: Problem -->
    <section id="problem" hidden>
      <p id="problem-message" class="problem" role="alert"></p>
      <button class="button" type="button" data-action="start-over">Start over</button>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
